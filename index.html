.medicines-view .subpage-title{margin:0}
.medicine-list{width:380px;display:grid;gap:16px}
.medicine-card{display:grid;align-content:center;gap:22px;min-height:160px;margin:0;padding:10px 12px;background:#edededb3;border-radius:20px;touch-action:pan-y;user-select:none;-webkit-touch-callout:none}
.medicine-card:focus-visible{outline:3px solid var(--strong-blue);outline-offset:-3px}
.medicine-card header{display:flex;justify-content:space-between;align-items:center;gap:5px;padding:0;border:0}
.medicine-card h3{margin:0;font-size:calc(40px * var(--font-scale));line-height:1.2;letter-spacing:.06em;font-weight:500;overflow-wrap:anywhere}
.medicine-card button{min-height:44px;padding:0;color:var(--strong-blue);font-size:calc(24px * var(--font-scale));letter-spacing:.06em;white-space:nowrap}
.medicine-line{display:block}
.medicine-card footer{margin:0;display:flex;justify-content:space-between;align-items:end;gap:6px;font-size:calc(32px * var(--font-scale));line-height:1.22;letter-spacing:.06em;font-weight:400}
.medicines-view .add-medicine{border-radius:20px;gap:13px;font-size:calc(36px * var(--font-scale))}
.medicine-plus{width:48px;height:48px;display:grid;place-items:center}
.medicine-plus img{display:block}
.delete-record{font-size:calc(30px * var(--font-scale));line-height:1.22;overflow-wrap:anywhere}
.delete-record p{margin:0 0 16px}
.delete-record>div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px}

/* Contact number is shown in the full-width bottom sheet. */
.overlay-backdrop:has(.dial-modal){align-items:flex-end;padding:0}
.dial-modal{width:402px;min-height:240px;padding:4px 0;border:0;border-radius:0 0 20px 20px;background:white;box-shadow:none;text-align:center}
.dial-modal h2,.dial-number,.dial-cancel{display:grid;place-items:center;width:100%;height:80px;margin:0;padding:0 10px;font-weight:500}
.dial-modal h2,.dial-cancel{font-size:calc(32px * var(--font-scale));letter-spacing:.06em}
.dial-number{font-size:calc(36px * var(--font-scale));letter-spacing:.06em;border-block:2px solid #0000001a;border-bottom-width:6px;overflow-wrap:anywhere}
.dial-cancel{height:72px}

</style>

const rowHeight=wheel=>parseFloat(getComputedStyle(wheel).getPropertyValue('--wheel-row-height'))||42;
const bound=(wheel,index)=>Math.max(0,Math.min(wheel.children.length-1,index));

function highlight(wheel,index){
 index=bound(wheel,index);
 const changed=Number(wheel.dataset.selected)!==index;
 wheel.dataset.selected=index;
 wheel.setAttribute('aria-valuenow',index);
 wheel.setAttribute('aria-valuetext',wheel.children[index].textContent);
 [...wheel.children].forEach((child,i)=>child.classList.toggle('selected',i===index));
 if(changed)wheel.dispatchEvent(new CustomEvent('wheelchange',{bubbles:true,detail:{value:wheel.children[index].textContent}}));
}

function selectWheel(wheel,index){
 index=bound(wheel,Math.round(index));
 highlight(wheel,index);
 wheel.scrollTop=index*rowHeight(wheel);
}

function setupWheel(wheel){
 const step=rowHeight(wheel);
 selectWheel(wheel,Number(wheel.dataset.selected));
 let wheelDelta=0,lastWheel=0,pointer=null,suppressClickUntil=0,snapTimer;
 const snap=()=>{if(wheel.isConnected&&!pointer)selectWheel(wheel,Number(wheel.dataset.selected));};
 // Handle wheel input explicitly: a trackpad and a mouse both change the centred value.
 wheel.addEventListener('wheel',event=>{
  event.preventDefault();
  if(Date.now()-lastWheel>180)wheelDelta=0;
  lastWheel=Date.now();
  wheelDelta+=event.deltaY*(event.deltaMode===1?step:event.deltaMode===2?wheel.clientHeight:1);
  const steps=Math.trunc(wheelDelta/24);
  if(steps){selectWheel(wheel,Number(wheel.dataset.selected)+steps);wheelDelta-=steps*24;}
 },{passive:false});
 wheel.addEventListener('pointerdown',event=>{
  if(event.button!==0)return;
  clearTimeout(snapTimer);
  pointer={id:event.pointerId,y:event.clientY,top:wheel.scrollTop,dragged:false};
  wheel.focus({preventScroll:true});
 });
 wheel.addEventListener('pointermove',event=>{
  if(!pointer||event.pointerId!==pointer.id)return;
  const delta=pointer.y-event.clientY;
  if(!pointer.dragged&&Math.abs(delta)<4)return;
  pointer.dragged=true;
  wheel.classList.add('dragging');
  if(!wheel.hasPointerCapture(event.pointerId))wheel.setPointerCapture(event.pointerId);
  event.preventDefault();
  // The portfolio scales the phone; convert pointer movement back to canvas pixels.
  const scale=wheel.getBoundingClientRect().height/wheel.offsetHeight||1;
  wheel.scrollTop=Math.max(0,Math.min((wheel.children.length-1)*step,pointer.top+delta/scale));
  highlight(wheel,Math.round(wheel.scrollTop/step));
 });
 const finish=event=>{
  if(!pointer||event.pointerId!==pointer.id)return;
  if(pointer.dragged)suppressClickUntil=Date.now()+350;
  pointer=null;
  wheel.classList.remove('dragging');
  if(wheel.hasPointerCapture(event.pointerId))wheel.releasePointerCapture(event.pointerId);
  snap();
 };
 wheel.addEventListener('pointerup',finish);
 wheel.addEventListener('pointercancel',finish);
 wheel.addEventListener('lostpointercapture',finish);
 wheel.addEventListener('click',event=>{
  if(Date.now()<suppressClickUntil){event.preventDefault();event.stopPropagation();}
 },true);
 wheel.addEventListener('scroll',()=>{
  highlight(wheel,Math.round(wheel.scrollTop/step));
  clearTimeout(snapTimer);
  if(!pointer)snapTimer=setTimeout(snap,120);
 },{passive:true});
}

function planSlots(plans){
 const slots=new Map(),unplaced=[];
 for(const p of plans){
  if(Number.isSafeInteger(p.slot)&&p.slot>=DEFAULT_TIMES.length&&p.slot<10000&&!slots.has(p.slot))slots.set(p.slot,p);
  else unplaced.push(p);
 }

  while(slots.has(slot))slot++;
  slots.set(slot,p);
 }
 return slots;
}

function contacts(){
 const list=[...state.contacts].sort((a,b)=>(b.id===state.pinned?1:0)-(a.id===state.pinned?1:0));
 const rows=list.map(c=>`<button class="contact-row" data-action="contact" data-id="${e(c.id)}"><span class="contact-avatar" aria-hidden="true">${e(c.symbol)}</span>${speakSpan(c.name)}${state.pinned===c.id?'<span class="pinned-badge">置顶</span>':''}</button>`).join('');
 return `<div class="subpage">${backLine('我的','profile')}<h2 class="subpage-title readable" data-speak>我的联系人</h2><div class="contact-list">${rows||'<p class="empty-state">暂无联系人</p>'}</div></div>`;
}
function contact(){
 const c=state.contacts.find(c=>c.id===selectedContact);
 if(!c)return contacts();
 return `<div class="subpage">${backLine('我的联系人','contacts')}<div class="contact-detail"><div class="contact-avatar" aria-hidden="true">${e(c.symbol)}</div><h2 class="readable" data-speak>${e(c.name)}</h2><button class="phone-number" data-action="dial" data-id="${e(c.id)}">${speakSpan(c.phone)}${icon('phone')}</button><button class="pin-contact" data-action="pin" data-id="${e(c.id)}" role="switch" aria-checked="${c.id===state.pinned}">${speakSpan('设为置顶联系人')}<i class="toggle ${c.id===state.pinned?'on':''}" aria-hidden="true"></i></button><button class="delete-contact" data-action="delete-contact" data-id="${e(c.id)}">删除联系人</button></div></div>`;
}
function medicines(){
 return `<div class="subpage medicines-view">${backLine('我的','profile')}<h2 class="subpage-title readable" data-speak>我的常用药</h2><div class="medicine-list">${state.medicines.map(m=>`<article class="medicine-card" data-medicine="${e(m.id)}" tabindex="0" aria-label="${e(m.name)}，长按或按回车打开删除确认">
  <header><h3 class="readable" data-speak>${e(m.name)}</h3><button data-action="edit-medicine" data-id="${e(m.id)}" aria-label="编辑${e(m.name)}">编辑</button></header>
  ${figmaAsset('medicine-line','medicine-line')}
  <footer><span class="readable" data-speak>每日${e(m.frequency)}次</span><span class="readable" data-speak>每次${e(m.dose)}片</span></footer>
 </article>`).join('')}<button class="add-medicine" data-action="add-medicine"><span class="medicine-plus">${figmaAsset('medicine-plus')}</span>添加常用药</button></div></div>`;
}
function history(){
 const dates=[['10月22日','周四',`${completionCount(state)}/${tasksFor(state).length}次`],['10月21日','周三','4/4次'],['10月20日','周二','4/4次'],['10月19日','周一','4/4次']];
 return `<div class="subpage history-view">${backLine('今日用药','today')}<h2 class="subpage-title readable" data-speak>用药记录</h2><div class="history-list">${dates.map(([date,day,count])=>`<div class="history-row readable" data-speak><span>${date} ${day}</span><span class="history-count">${count}</span></div>`).join('')}</div></div>`;
}
function settings(){return `<div class="subpage">${backLine('我的','profile')}<h2 class="subpage-title readable" data-speak>设置</h2><section class="settings-card"><h3 class="readable" data-speak>字号大小</h3><div class="font-options">${[[1,'标准'],[1.12,'大号'],[1.24,'特大']].map(([v,t])=>`<button data-action="font" data-value="${v}" class="${state.fontScale===v?'selected':''}" aria-pressed="${state.fontScale===v}">${t}${state.fontScale===v?' ✓':''}</button>`).join('')}</div></section><section class="settings-card"><h3 class="readable" data-speak>文字预览</h3><p class="font-sample readable" data-speak>今日用药<br>每一次用药，都清楚一点。</p></section></div>`;}
function render(keepScroll=true){
 const prev=$('.app-content');
 if(prev&&keepScroll)scrollPositions[page]=prev.scrollTop;
 app.className=figmaViews.has(page)?'app figma-view':'app';
 app.style.setProperty('--font-scale',state.fontScale);
 $('#phone').style.setProperty('--font-scale',state.fontScale);
 const views={today,plan,profile,contacts,contact,medicines,history,settings};
 const levels=figmaViews.has(page)?`<div class="status-levels" aria-hidden="true">${figmaAsset('status-cell')}${figmaAsset('status-wifi')}${figmaAsset('status-battery')}</div>`:statusIcons;
 const family=['today','history'].includes(page)?`<button class="contact-family" data-action="family">${figmaAsset('family-phone')}<span>联系家属</span></button>`:'';
 const addContact=page==='contacts'?`<button class="add-contact" data-action="add-contact" aria-label="添加联系人">${icon('addUser')}</button>`:'';
 app.innerHTML=`<div class="status-bar"><span>9:41</span>${levels}</div><div class="app-content ${state.fontScale>1?'font-enlarged':''}">${views[page]()}</div>${nav()}${family}${addContact}`;
 const content=$('.app-content'),header=content.querySelector('.page-fixed-header');
 content.style.scrollPaddingTop=header?header.offsetHeight+'px':'0px';
 content.scrollTop=scrollPositions[page]||0;
 $$('[data-scene]').forEach(b=>b.classList.toggle('active',b.dataset.scene===(['today','history'].includes(page)?'today':page==='plan'?'plan':'profile')));
}
function go(p){if(!['today','plan','profile','contacts','contact','medicines','history','settings'].includes(p))return;stopReading();const content=$('.app-content');if(content)scrollPositions[page]=content.scrollTop;closeModal(false);page=p;render(false);}
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),3200);}
function modalShell(content,cls='',label='操作弹窗'){return `<div class="overlay-backdrop"><section class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${e(label)}" tabindex="-1">${content}</section></div>`;}
const closeButton=()=>`<button class="modal-close" data-action="close" aria-label="关闭">${icon('close')}</button>`;
function actions(primary='确认',action='save',secondary=''){return `<div class="modal-actions"><button class="primary" data-action="${action}">${primary}</button>${secondary?`<button class="secondary" data-action="close">${secondary}</button>`:''}</div>`;}
function planMedicineNames(){return [...new Set(state.medicines.map(m=>m.name).filter(Boolean))];}
function setPlanMedicineOptions(open){
 const options=$('#plan-medicine-options');
 const toggle=$('#plan-medicine-toggle');
 options.hidden=!open;
 toggle.setAttribute('aria-expanded',String(open));
 if(open)options.querySelector('button').focus();
}
function newPlanMedicine(){return {name:'',dose:'1片',frequency:1};}
const planDosePattern=/^(\d+(?:\.\d+)?|半)\s*(\p{L}+)?$/u;
function planDoseParts(dose){
 const [,amount=dose,unit='']=planDosePattern.exec(dose)??[];
 return {amount,unit};
}
function displayPlanDose(dose){
 const {amount,unit}=planDoseParts(dose);
 $('#dose-output').value=amount;
 $('#dose-unit').textContent=unit;
}
function showModal(type,context={}){stopReading();if(!modal)lastFocus=document.activeElement;modal=type;modalContext=context;app.inert=true;renderModal();}
function closeModal(restore=true){overlay.innerHTML='';modal=null;app.inert=false;if(restore&&lastFocus?.isConnected)lastFocus.focus({preventScroll:true});lastFocus=null;}
function renderModal(focusSelector){let html='';
 if(modal==='name')html=modalShell(modalContext.stage==='input'?`<input id="name-input" aria-label="请输入您的姓名" maxlength="12" autocomplete="off" value="${e(modalContext.value??state.name)}" placeholder="">${actions('确认','save-name')}`:`<button class="name-prompt" data-action="name-input">请输入您的姓名</button><div class="modal-actions"><button class="blue-button" data-action="close">返回</button></div>`,'name-modal','编辑姓名');
 if(modal==='dose'||modal==='missed'){
